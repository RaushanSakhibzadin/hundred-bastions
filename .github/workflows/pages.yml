name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Tries to turn Pages on automatically. On most repositories the
          # workflow token is not permitted to create the Pages site -- it
          # fails with "Resource not accessible by integration" -- so the first
          # time, enable it by hand:
          #
          #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
          #
          # then re-run this workflow. Once the site exists this step succeeds
          # on its own and never needs touching again.
          enablement: true
      # There is no build step. The repository root is the site.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploy
        uses: actions/deploy-pages@v4
